description = "TrustForge registry contract — maps identities to bond contracts"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "22.0"
trustforge_errors = { path = "../trustforge_errors" }

[dev-dependencies]
soroban-sdk = { version = "22.0", features = ["testutils"] }
