[package]
name = "trustforge_arbitration"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "TrustForge arbitration voting system — weighted voting for dispute resolution"

[lib]
# `rlib` is added alongside `cdylib` so the datakey-fingerprint integration test
# (tests/datakey_fingerprint.rs) can link the contract as a normal Rust
# dependency. The `cdylib` artifact used for the on-chain wasm is unaffected.
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22.0"
trustforge_errors = { path = "../trustforge_errors" }

[dev-dependencies]
soroban-sdk = { version = "22.0", features = ["testutils"] }
# Test-only: deploy real bond/registry contracts to build realistic weight-derivation
# fixtures. Dev-dependencies never ship in the release WASM (unlike a regular
# dependency, which would collide at the WASM export level — both crates define
# entrypoints named `initialize`/`pause`/`version`; see lib.rs's BondRegistryEntry
# doc comment), so this is safe even though the production code path can't use it.
trustforge_bond = { path = "../trustforge_bond", features = ["testutils"] }
trustforge_registry = { path = "../trustforge_registry" }
