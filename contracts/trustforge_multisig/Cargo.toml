[package]
name = "trustforge_multisig"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "TrustForge multi-signature contract — governance and administrative actions with configurable threshold"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "22.0"
trustforge_errors = { path = "../trustforge_errors" }

[dev-dependencies]
soroban-sdk = { version = "22.0", features = ["testutils"] }
