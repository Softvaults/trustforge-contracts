[package]
name = "templates"
version = "0.1.0"
edition = "2021"
description = "TrustForge Soroban contract template — canonical starting point for new contracts"

[lib]
crate-type = ["cdylib"]

[dependencies]
trustforge_errors = { version = "0.1.0", path = "../trustforge_errors" }
soroban-sdk = "22.0"

[dev-dependencies]
soroban-sdk = { version = "22.0", features = ["testutils"] }
