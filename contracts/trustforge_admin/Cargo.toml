[package]
name = "trustforge_admin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22.0"
trustforge_errors = { path = "../trustforge_errors" }

[dev-dependencies]
soroban-sdk = { version = "22.0", features = ["testutils"] }
testutils = { path = "../../crates/testutils" }

[features]
testutils = ["soroban-sdk/testutils"]
