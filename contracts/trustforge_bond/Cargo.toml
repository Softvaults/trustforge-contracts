[package]
name = "trustforge_bond"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
# Disable autodiscovery of the stale `tests/` integration crates.
# `tests/test_fee_on_transfer_rejection.rs` targets an abandoned token-based
# contract API (set_token/get_nonce/create_bond_with_rolling) that does not
# exist in the canonical contract; it never compiled. Two more files with the
# same abandoned-API problem (`tests/migration_test.rs`, `tests/indexer_replay.rs`)
# were confirmed broken and deleted 2026-08-12 during the docs/BOND_REVIEW_NOTE.md
# review rather than left as further silently-excluded dead weight; see that
# doc for the compile-error evidence. The bond
# invariants suite lives in the library's #[cfg(test)] modules instead, so the
# whole package builds and tests green with `cargo test -p trustforge_bond`.
autotests = false
# The gas baseline lives in benches/ and the refresher in a bin; declare both
# explicitly so cargo does not try to autodiscover the shared `harness.rs`
# module as its own target.
autobenches = false
autobins = false

[[test]]
name = "proptest_tier"
path = "tests/proptest_tier.rs"

[lib]
# `rlib` is added alongside `cdylib` so the cost harness (bench + bin) can link
# the contract as a normal Rust dependency. The `cdylib` artifact used for the
# on-chain wasm is unaffected.
crate-type = ["cdylib", "rlib"]

# Deterministic gas-regression gate. Run with
# `cargo bench -p trustforge_bond --features gas-bench --bench cost`.
[[bench]]
name = "cost"
path = "benches/cost.rs"
harness = false
test = false
required-features = ["gas-bench"]

# Baseline refresher & diff reporter. Run with
# `cargo run -p trustforge_bond --features gas-bench --bin update-cost-baseline`.
[[bin]]
name = "update-cost-baseline"
path = "benches/update_cost_baseline.rs"
test = false
required-features = ["gas-bench"]

# Storage cost regression test. Runs as part of `cargo test` on every CI matrix.
[[test]]
name = "test_cost_regression"
path = "tests/test_cost_regression.rs"

[dependencies]
trustforge_errors = { path = "../trustforge_errors" }
trustforge_math = { path = "../trustforge_math" }
timelock = { path = "../timelock" }
# soroban-sdk is always required; testutils APIs are only needed for test
# builds and are gated via the `testutils` feature defined below.
soroban-sdk = { version = "22.0" }

[dev-dependencies]
# proptest is only used in #[cfg(test)] / fuzz modules — not in release WASM.
proptest = "1.11.0"
soroban-sdk = { version = "22.0", features = ["testutils"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(skip_slash_invariant)', 'cfg(feature, values("testutils"))'] }

[features]
default = []
# Enable testutils APIs (Address::generate, mock_all_auths, etc.) for
# off-chain tooling, integration harnesses, and benchmarks that link the
# crate as an rlib.  Must NOT be enabled when building the release WASM.
testutils = ["soroban-sdk/testutils"]
gas-bench = ["soroban-sdk/testutils"]
